name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile models.py utils.py stage1_train.py stage2_train.py inspect_data.py
      - name: Check notebook code cells
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').glob('generate*.ipynb'):
              notebook = json.loads(path.read_text(encoding='utf-8'))
              for cell in notebook['cells']:
                  if cell['cell_type'] == 'code':
                      compile(''.join(cell['source']), str(path), 'exec')
          PY
